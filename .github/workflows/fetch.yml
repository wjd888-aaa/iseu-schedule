name: Fetch Schedule
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch schedule
        run: node scripts/fetch-schedule.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit & push if changed
        run: |
          git config user.name "Schedule Bot"
          git config user.email "bot@localhost"
          git add schedule-data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "auto: update schedule data $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
